name: Frontend Modernization Checks

on:
  pull_request:
    paths:
      - 'public/script.js'
      - 'public/scripts/**'
      - 'frontend/**'
      - 'scripts/check-import-boundaries.mjs'
      - 'package.json'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/frontend-modernization-checks.yml'
  push:
    paths:
      - 'public/script.js'
      - 'public/scripts/**'
      - 'frontend/**'
      - 'scripts/check-import-boundaries.mjs'
      - 'package.json'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/frontend-modernization-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Enforce Import Boundaries
        run: npm run check:import-boundaries

      - name: UI Typecheck
        run: npm run ui:typecheck

      - name: UI Tests
        run: npm run ui:test
